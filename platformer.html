<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Платформер - 2 Уровня</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 3px solid #444;
            background-color: #87CEEB;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 36px;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        Уровень: <span id="level-display">1</span>/2<br>
        Управление: Стрелки или WASD
    </div>
    <div id="message"></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelDisplay = document.getElementById('level-display');
        const messageDisplay = document.getElementById('message');

        // Игрок
        const player = {
            x: 50,
            y: 400,
            width: 30,
            height: 40,
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: -12,
            gravity: 0.6,
            grounded: false,
            color: '#FF4500'
        };

        // Управление
        const keys = {
            left: false,
            right: false,
            up: false
        };

        // Уровни
        const levels = [
            // Уровень 1
            {
                platforms: [
                    { x: 0, y: 550, width: 800, height: 50 },     // Пол
                    { x: 200, y: 450, width: 150, height: 20 },   // Платформа 1
                    { x: 400, y: 350, width: 150, height: 20 },   // Платформа 2
                    { x: 600, y: 250, width: 150, height: 20 },   // Платформа 3
                    { x: 50, y: 300, width: 100, height: 20 }     // Платформа 4
                ],
                goal: { x: 720, y: 200, width: 40, height: 50 },
                playerStart: { x: 50, y: 400 },
                backgroundColor: '#87CEEB',
                name: 'Уровень 1'
            },
            // Уровень 2
            {
                platforms: [
                    { x: 0, y: 550, width: 200, height: 50 },     // Начальная платформа
                    { x: 250, y: 500, width: 100, height: 20 },   // Платформа 1
                    { x: 400, y: 450, width: 100, height: 20 },   // Платформа 2
                    { x: 550, y: 400, width: 100, height: 20 },   // Платформа 3
                    { x: 700, y: 350, width: 100, height: 20 },   // Платформа 4
                    { x: 500, y: 250, width: 150, height: 20 },   // Платформа 5
                    { x: 250, y: 200, width: 150, height: 20 },   // Платформа 6
                    { x: 50, y: 150, width: 150, height: 20 },    // Платформа 7
                    { x: 0, y: 580, width: 800, height: 20 }      // Опасный пол
                ],
                goal: { x: 80, y: 100, width: 40, height: 50 },
                playerStart: { x: 50, y: 450 },
                backgroundColor: '#FFB6C1',
                name: 'Уровень 2'
            }
        ];

        let currentLevel = 0;
        let gameWon = false;

        // Обработчики событий клавиатуры
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if ((e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') && player.grounded) {
                player.velocityY = player.jumpPower;
                player.grounded = false;
            }
            
            // Перезапуск после победы
            if (gameWon && e.code === 'Space') {
                resetGame();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
        });

        function resetGame() {
            currentLevel = 0;
            gameWon = false;
            player.x = levels[currentLevel].playerStart.x;
            player.y = levels[currentLevel].playerStart.y;
            player.velocityX = 0;
            player.velocityY = 0;
            levelDisplay.textContent = currentLevel + 1;
            messageDisplay.style.display = 'none';
        }

        function loadLevel(levelIndex) {
            const level = levels[levelIndex];
            player.x = level.playerStart.x;
            player.y = level.playerStart.y;
            player.velocityX = 0;
            player.velocityY = 0;
            levelDisplay.textContent = levelIndex + 1;
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            if (gameWon) return;

            // Горизонтальное движение
            if (keys.left) {
                player.velocityX = -player.speed;
            } else if (keys.right) {
                player.velocityX = player.speed;
            } else {
                player.velocityX = 0;
            }

            // Применяем гравитацию
            player.velocityY += player.gravity;

            // Обновляем позицию
            player.x += player.velocityX;
            player.y += player.velocityY;

            // Ограничение по горизонтали
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Проверка коллизий с платформами
            player.grounded = false;
            const level = levels[currentLevel];
            
            for (const platform of level.platforms) {
                if (checkCollision(player, platform)) {
                    // Определяем направление коллизии
                    const overlapX = (player.width + platform.width) / 2 - Math.abs((player.x + player.width / 2) - (platform.x + platform.width / 2));
                    const overlapY = (player.height + platform.height) / 2 - Math.abs((player.y + player.height / 2) - (platform.y + platform.height / 2));

                    if (overlapX < overlapY) {
                        // Горизонтальная коллизия
                        if (player.velocityX > 0) {
                            player.x = platform.x - player.width;
                        } else {
                            player.x = platform.x + platform.width;
                        }
                        player.velocityX = 0;
                    } else {
                        // Вертикальная коллизия
                        if (player.velocityY > 0) {
                            player.y = platform.y - player.height;
                            player.grounded = true;
                            player.velocityY = 0;
                        } else {
                            player.y = platform.y + platform.height;
                            player.velocityY = 0;
                        }
                    }
                }
            }

            // Проверка падения вниз
            if (player.y > canvas.height) {
                loadLevel(currentLevel);
            }

            // Проверка достижения цели
            if (checkCollision(player, level.goal)) {
                if (currentLevel < levels.length - 1) {
                    currentLevel++;
                    loadLevel(currentLevel);
                    showMessage(`Уровень ${currentLevel}!`, 2000);
                } else {
                    gameWon = true;
                    showMessage('ПОБЕДА!\nНажмите Пробел для рестарта', 0);
                }
            }
        }

        function showMessage(text, duration) {
            messageDisplay.textContent = text;
            messageDisplay.style.display = 'block';
            if (duration > 0) {
                setTimeout(() => {
                    messageDisplay.style.display = 'none';
                }, duration);
            }
        }

        function draw() {
            const level = levels[currentLevel];
            
            // Очистка и фон
            ctx.fillStyle = level.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем платформы
            ctx.fillStyle = '#654321';
            for (const platform of level.platforms) {
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                
                // Трава сверху платформы
                ctx.fillStyle = '#228B22';
                ctx.fillRect(platform.x, platform.y, platform.width, 5);
                ctx.fillStyle = '#654321';
            }

            // Рисуем цель
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(level.goal.x, level.goal.y, level.goal.width, level.goal.height);
            
            // Блик на цели
            ctx.fillStyle = '#FFFFE0';
            ctx.fillRect(level.goal.x + 5, level.goal.y + 5, level.goal.width - 10, level.goal.height - 10);

            // Рисуем игрока
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Глаза игрока
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 5, player.y + 8, 8, 8);
            ctx.fillRect(player.x + 17, player.y + 8, 8, 8);
            ctx.fillStyle = 'black';
            ctx.fillRect(player.x + 7, player.y + 10, 4, 4);
            ctx.fillRect(player.x + 19, player.y + 10, 4, 4);

            // Индикатор уровня
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(10, 10, 150, 30);
            ctx.fillStyle = 'white';
            ctx.font = '16px Arial';
            ctx.fillText(`Уровень: ${currentLevel + 1}/${levels.length}`, 20, 32);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Запуск игры
        loadLevel(0);
        gameLoop();
    </script>
</body>
</html>
