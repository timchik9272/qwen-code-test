<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Платформер - 5 Уровней</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #1a1a2e; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; z-index: 100; background: rgba(0,0,0,0.6); padding: 15px 25px; border-radius: 10px; }
        #message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 48px; text-align: center; display: none; z-index: 100; background: rgba(0,0,0,0.8); padding: 40px 60px; border-radius: 20px; }
        #controls-hint { position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.8); font-size: 16px; z-index: 100; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="ui">Уровень: <span id="level-display">1</span>/5<br>Жизни: <span id="lives-display">❤️❤️❤️</span></div>
    <div id="controls-hint">← → или A D - Движение | Пробел или ↑ - Прыжок | R - Рестарт</div>
    <div id="message"></div>
    <canvas id="gameCanvas"></canvas>
